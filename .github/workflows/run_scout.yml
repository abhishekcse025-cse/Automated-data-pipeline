name: RBI Sovereign Brief

on:
  schedule:
    # 02:30 UTC = 08:00 AM IST
    - cron: '30 2 * * *'
  workflow_dispatch: # Your manual test button

jobs:
  scout_job:
    runs-on: ubuntu-latest
    
    # CRITICAL: Grant the robot permission to save files
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install google-genai playwright requests
          playwright install chromium

      - name: Run RBI Scout
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scout.py

      - name: Commit and Push Archives
        run: |
          git config --global user.name "Sovereign-Bot"
          git config --global user.email "actions@github.com"
          
          # Check if the briefs directory exists and has files
          if [ -d "briefs" ] && [ "$(ls -A briefs/*.md 2>/dev/null)" ]; then
            git add last_notif.txt briefs/*.md
            if git diff --staged --quiet; then
              echo "No new updates to archive today."
            else
              git commit -m "Archive: New Sovereign Brief [$(date)]"
              git push
            fi
          else
            echo "No new briefs found to archive. Skipping git push."
          fi