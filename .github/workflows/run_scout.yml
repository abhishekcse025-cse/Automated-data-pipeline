name: Ghost Pipeline Hourly Scout
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install playwright google-genai
          playwright install --with-deps chromium 

      - name: Run Scout
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scout.py
- name: Save Memory
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add last_notif.txt
          git commit -m "Update memory: Latest RBI notification tracked" || exit 0
          git push