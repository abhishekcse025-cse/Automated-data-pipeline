name: Ghost Pipeline Regulatory Scout
on:
  schedule:
    - cron: '*/15 * * * *' # Runs every 15 minutes
  workflow_dispatch: # Allows you to run it manually

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # CRITICAL: Allows the bot to save memory files
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install playwright google-genai requests
          playwright install --with-deps chromium 

      - name: Run Scout
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scout.py

      - name: Save Memory
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          # Check if the file exists before trying to commit it
          if [ -f last_notif.txt ]; then
            git add last_notif.txt
            git commit -m "Update memory: Latest RBI notification tracked" || echo "No changes to commit"
            git push
          fi